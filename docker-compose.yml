services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
      TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking_test
    ports:
      - "8000:8000"
    volumes:
      - ./pyproject.toml:/srv/pyproject.toml
      - ./backend:/srv/backend
      - ./tests:/srv/tests
    depends_on:
      db:
        condition: service_healthy

  # Фоновая задача: за несколько минут до встречи создаёт видеовстречу и
  # рассылает гостям ссылки. Отдельный сервис, а не часть API: письма должны
  # уходить, даже если кто-то перезапускает сервис.
  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/srv/backend

volumes:
  pgdata: