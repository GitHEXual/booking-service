services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking
      TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@db:5432/booking_test
    ports:
      - "8000:8000"
    volumes:
      # Настройки pytest и ruff тоже из файла: иначе контейнер проверял бы
      # тесты по правилам из образа, собранного до правки настроек.
      - ./pyproject.toml:/srv/pyproject.toml
      - ./backend:/srv/backend
      - ./tests:/srv/tests
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: