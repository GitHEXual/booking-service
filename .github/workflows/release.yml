# Релиз по тегу вида v1.2.3.
#
# Собираем образ, публикуем его в GitHub Container Registry и создаём GitHub
# Release с автоматическим списком изменений. Тег ставит человек:
#   git tag -a v1.0.0 -m "Первый релиз" && git push origin v1.0.0
name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Запись нужна для создания релиза, packages для публикации образа.
permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Образ в GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать теги и метки
        id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` это `владелец/репозиторий`, ровно путь в GHCR.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Собрать и запушить образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes
