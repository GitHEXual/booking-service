# Проверка проекта при каждом изменении.
#
# Тесты гоняются против настоящего PostgreSQL: подменить хранилище значило бы
# проверять не то, что пойдёт в бой. База поднимается сервисом GitHub Actions,
# тестовая база создаётся и наполняется миграциями самими тестами.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и проверки
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # База из сервиса выше. Тесты сами создадут booking_test по этим адресам.
      DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking
      TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking_test
      # Значения ниже нужны только для проверок и в бою не используются.
      SESSION_SECRET: SVPj8W3rQb2GFIa035HT8_XbE8ujfnHguKzejrfKErk
      PII_ENCRYPTION_KEY: 5X0ZWG8w49GQRcTdqoWURN0c4B_XaY5No0khkP1EG0U
      PII_LOOKUP_KEY: 8pbBcxuyGrmi17h1uTaTlen8R5hKiJ_sGN3N5Ymylgs
      YANDEX_CLIENT_ID: ci-client
      YANDEX_CLIENT_SECRET: ci-secret
      YANDEX_REDIRECT_URI: http://localhost:8000/auth/yandex/callback
      SMTP_USERNAME: ci@example.com
      SMTP_PASSWORD: ci-password
      CONSENT_DOCUMENT_VERSION: "2026-10-01"

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Проверка стиля
        run: ruff check .

      - name: Тесты
        run: pytest -q

      - name: Поставить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости интерфейса
        run: npm ci
        working-directory: frontend

      - name: Проверка типов интерфейса
        run: npm run typecheck
        working-directory: frontend

      - name: Собрать интерфейс
        run: npm run build
        working-directory: frontend

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build --tag booking-service:ci .
