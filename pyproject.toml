[project]
name = "booking-service"
version = "0.1.0"
description = "Сервис записи на встречи с приватной видеоконференцией"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "aiosmtplib==5.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Один цикл событий на весь прогон: движок базы и пул соединений живут дольше
# одного теста, и создавать их на каждый тест дорого.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` в аргументах обработчика это способ, которым FastAPI объявляет
# зависимости. Проверка видит вызов функции в значении по умолчанию и ругается
# на каждый обработчик, поэтому здесь её отключаем.
"backend/routes/*.py" = ["B008"]
# Миграции пишет генератор Alembic, а не человек. Он не переносит длинные
# строки и не ставит `# noqa`, поэтому руками выравнивать бессмысленно.
"backend/migrations/versions/*.py" = ["E501"]